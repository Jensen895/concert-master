openapi: 3.1.0
info:
  title: Concert Master API
  version: 0.1.0
  description: API boundary for user-authorized ticket-page analysis and input planning.
servers:
  - url: http://127.0.0.1:8787
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/detections/captcha:
    post:
      operationId: detectCaptcha
      description: Detects whether a CAPTCHA is present and signals that human action is required. It does not solve a CAPTCHA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrameRequest"
      responses:
        "200":
          description: CAPTCHA detection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptchaDetectionResponse"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/detections/question:
    post:
      operationId: detectQuestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrameRequest"
      responses:
        "200":
          description: Question detection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionDetectionResponse"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/automation/text-input:
    post:
      operationId: createTextInputPlan
      description: Produces a field-to-target plan. The Mac client resolves values locally and confirms execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextInputPlanRequest"
      responses:
        "200":
          description: A user-confirmable input plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextInputPlanResponse"
        "501":
          $ref: "#/components/responses/NotImplemented"
components:
  responses:
    NotImplemented:
      description: The route exists but its provider is not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string }
        version: { type: string }
    FrameReference:
      type: object
      required: [sessionID, frameID, capturedAt]
      properties:
        sessionID: { type: string, format: uuid }
        frameID: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time }
    FrameRequest:
      type: object
      required: [frame]
      properties:
        frame:
          $ref: "#/components/schemas/FrameReference"
    CaptchaDetectionResponse:
      type: object
      required: [detected, confidence, requiresHumanAction]
      properties:
        detected: { type: boolean }
        confidence: { type: number, minimum: 0, maximum: 1 }
        requiresHumanAction: { type: boolean }
    DetectedQuestion:
      type: object
      required: [id, text, confidence]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
    QuestionDetectionResponse:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/DetectedQuestion"
    ProfileFieldReference:
      type: string
      enum: [country, governmentID, dateOfBirth, firstName, lastName]
    TextInputPlanRequest:
      type: object
      required: [sessionID, requestedFields]
      properties:
        sessionID: { type: string, format: uuid }
        requestedFields:
          type: array
          items:
            $ref: "#/components/schemas/ProfileFieldReference"
    TextInputStep:
      type: object
      required: [id, field, targetLabel]
      properties:
        id: { type: string, format: uuid }
        field:
          $ref: "#/components/schemas/ProfileFieldReference"
        targetLabel: { type: string }
    TextInputPlanResponse:
      type: object
      required: [steps, requiresConfirmation]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TextInputStep"
        requiresConfirmation: { type: boolean, const: true }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
